steps:
  - id: kanikoBuild
    name: "us-central1-docker.pkg.dev/$PROJECT_ID/docker/kaniko:latest"
    entrypoint: "bash"
    args:
      [
        "-c",
        '/kaniko/executor --destination=us-central1-docker.pkg.dev/$PROJECT_ID/docker/populate-db-image:$TAG_NAME --destination=us-central1-docker.pkg.dev/$PROJECT_ID/docker/populate-db-image:latest --cache=false --cache-ttl=365h --build-arg GITHUBPRIVATEKEY="$(echo $$GITHUBPRIVATEKEY)"',
      ]
    secretEnv: ["GITHUBPRIVATEKEY"]

  - id: k8sApply
    name: "gcr.io/cloud-builders/kubectl"
    args: ["apply", "-f", "k8s/"]
    env:
      - "CLOUDSDK_COMPUTE_ZONE=us-central1-b"
      - "CLOUDSDK_CONTAINER_CLUSTER=ikomida-prod-cluster"
    waitFor:
      - kanikoBuild

availableSecrets:
  secretManager:
    - versionName: projects/981415290588/secrets/google-service-account/versions/1
      env: "GITHUBPRIVATEKEY"
